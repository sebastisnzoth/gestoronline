<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Control - Gestoría</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .login-card { max-width: 400px; margin: 0 auto; }
    .hidden { display: none; }
    .tab-active { border-bottom: 2px solid #4F46E5; color: #4F46E5; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- Login Screen -->
  <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
    <div class="login-card bg-white rounded-xl shadow-lg p-8">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-primary rounded-xl flex items-center justify-center text-white font-bold text-2xl mx-auto mb-3">G</div>
        <h1 class="text-2xl font-bold text-gray-900">Panel de Control</h1>
        <p class="text-gray-500 text-sm mt-1">Gestión de turnos para extranjeros</p>
      </div>
      
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
          <input type="password" id="loginPassword" required 
                 class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500" 
                 placeholder="Ingrese la contraseña" />
        </div>
        <button type="submit" class="w-full bg-primary hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg transition">
          Ingresar
        </button>
      </form>
      
      <p id="loginError" class="text-red-500 text-sm text-center mt-3 hidden">Contraseña incorrecta</p>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="hidden min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-10">
      <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-primary rounded-lg flex items-center justify-center text-white font-bold text-xl">G</div>
          <div>
            <h1 class="text-lg font-bold text-gray-900">Panel de Administración</h1>
            <p class="text-xs text-gray-500">Gestión de Turnos</p>
          </div>
        </div>
        <button onclick="logout()" class="text-sm text-gray-500 hover:text-gray-700">Cerrar sesión</button>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
      <!-- Stats Cards -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div class="bg-white rounded-lg p-4 shadow-sm">
          <div class="text-3xl font-bold text-gray-900" id="statTotal">0</div>
          <div class="text-sm text-gray-500">Total Turnos</div>
        </div>
        <div class="bg-white rounded-lg p-4 shadow-sm">
          <div class="text-3xl font-bold text-yellow-600" id="statPending">0</div>
          <div class="text-sm text-gray-500">Pendientes</div>
        </div>
        <div class="bg-white rounded-lg p-4 shadow-sm">
          <div class="text-3xl font-bold text-green-600" id="statToday">0</div>
          <div class="text-sm text-gray-500">Hoy</div>
        </div>
        <div class="bg-white rounded-lg p-4 shadow-sm">
          <div class="text-3xl font-bold text-blue-600" id="statCompleted">0</div>
          <div class="text-sm text-gray-500">Completados</div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="bg-white rounded-lg shadow-sm mb-6">
        <div class="border-b">
          <nav class="flex">
            <button onclick="switchTab('turnos')" id="tab-turnos" class="tab-btn tab-active px-6 py-3 font-medium text-sm">
              📅 Turnos
            </button>
            <button onclick="switchTab('servicios')" id="tab-servicios" class="tab-btn px-6 py-3 font-medium text-sm text-gray-500 hover:text-gray-700">
              ⚙️ Servicios
            </button>
          </nav>
        </div>

        <!-- Turnos Tab -->
        <div id="content-turnos" class="p-4">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-semibold">Lista de Turnos</h2>
            <div class="flex gap-2">
              <select id="filterStatus" onchange="loadAppointments()" class="border rounded-lg px-3 py-1 text-sm">
                <option value="">Todos los estados</option>
                <option value="pending">Pendiente</option>
                <option value="confirmed">Confirmado</option>
                <option value="completed">Completado</option>
                <option value="cancelled">Cancelado</option>
              </select>
              <button onclick="loadAppointments()" class="bg-gray-100 hover:bg-gray-200 px-3 py-1 rounded-lg text-sm">🔄 Actualizar</button>
            </div>
          </div>
          
          <div id="appointmentsList" class="space-y-3">
            <div class="text-center py-8 text-gray-500">Cargando turnos...</div>
          </div>
        </div>

        <!-- Servicios Tab -->
        <div id="content-servicios" class="p-4 hidden">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-semibold">Catálogo de Servicios</h2>
            <button onclick="showAddService()" class="bg-primary hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm">+ Nuevo Servicio</button>
          </div>
          
          <div id="servicesList" class="space-y-2">
            <div class="text-center py-8 text-gray-500">Cargando servicios...</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Service Modal -->
  <div id="serviceModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-lg p-6 w-full max-w-md">
      <h3 class="text-lg font-semibold mb-4" id="modalTitle">Nuevo Servicio</h3>
      <form id="serviceForm" class="space-y-4">
        <input type="hidden" id="serviceId">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nombre *</label>
          <input type="text" id="serviceName" required class="w-full border rounded-lg px-4 py-2" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
          <textarea id="serviceDesc" rows="2" class="w-full border rounded-lg px-4 py-2"></textarea>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Duración (minutos)</label>
          <input type="number" id="serviceDuration" value="30" class="w-full border rounded-lg px-4 py-2" />
        </div>
        <div class="flex gap-2">
          <button type="button" onclick="closeServiceModal()" class="flex-1 border border-gray-300 py-2 rounded-lg">Cancelar</button>
          <button type="submit" class="flex-1 bg-primary text-white py-2 rounded-lg">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
